[package]
name = "philo-model"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
philo = { version = "=0.5.2", path = "../../../philo/crates/philo" }
philo-agent-runtime = { path = "../philo-agent-runtime" }
# Image bytes hand off to the SDK as `bytes::Bytes` (the SDK's public input type).
bytes = "1.10"
futures = "0.3"
http = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tracing = "0.1"
url = "2.5"

[dev-dependencies]
philo-session = { path = "../philo-session" }
philo-session-jsonl = { path = "../philo-session-jsonl" }
philo-tools = { path = "../philo-tools" }
philo-tools-std = { path = "../philo-tools-std" }
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }
