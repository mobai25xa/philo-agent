[package]
name = "philo-model"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Registry-pinned SDK: upgrades are deliberate (bump version, fix, test).
# For local iteration against an unpublished SDK state, temporarily add:
#   [patch.crates-io]
#   philo = { path = "../../../philo/crates/philo" }
philo = "=0.10.0"
philo-agent-runtime = { path = "../philo-agent-runtime" }
# Image bytes hand off to the SDK as `bytes::Bytes` (the SDK's public input type).
bytes = "1.10"
futures = "0.3"
http = "1.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt", "sync"] }
tracing = "0.1"
url = "2.5"

[dev-dependencies]
futures = "0.3"
philo-session = { path = "../philo-session" }
philo-session-jsonl = { path = "../philo-session-jsonl" }
philo-tools = { path = "../philo-tools" }
philo-tools-std = { path = "../philo-tools-std" }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "test-util"] }
