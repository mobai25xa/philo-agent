[package]
name = "philo-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# Composition root and dependency-graph sink: the first binary. Scenario
# knowledge (tool lineup, prompt, defaults) comes from philo-coding-profile;
# model selection (endpoint, protocol, credentials env) is deployment
# configuration owned here.
[[bin]]
name = "philo"
path = "src/main.rs"

[dependencies]
philo-agent-runtime = { path = "../philo-agent-runtime" }
philo-coding-profile = { path = "../philo-coding-profile" }
philo-model = { path = "../philo-model" }
philo-session = { path = "../philo-session" }
philo-session-jsonl = { path = "../philo-session-jsonl" }
clap = { version = "4", features = ["derive"] }
dirs = "6"
tokio = { version = "1", features = ["rt", "signal", "macros"] }
philo-tui = { version = "0.1.0", path = "../philo-tui" }
toml = "1.1.4"
