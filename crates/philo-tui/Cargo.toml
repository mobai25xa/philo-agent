[package]
name = "philo-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
arboard = "3"
crossterm = { version = "0.29", features = ["event-stream"] }
futures-core = "0.3.34"
philo-agent-service = { path = "../philo-agent-service" }
png = "0.18"
pulldown-cmark = { version = "0.13", default-features = false }
ratatui = { version = "0.30.2", features = ["scrolling-regions"] }
syntect = { version = "5", default-features = false, features = ["default-fancy"] }
tokio = { version = "1.53.1", features = ["macros", "rt", "sync", "time"] }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.2"

[dev-dependencies]
insta = "1.48.0"
philo-agent-runtime = { path = "../philo-agent-runtime" }
tokio = { version = "1.53.1", features = ["macros", "rt", "rt-multi-thread", "test-util", "time"] }
