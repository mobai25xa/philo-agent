[package]
name = "philo-tui"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
crossterm = { version = "0.29", features = ["event-stream"] }
futures-core = "0.3.34"
philo-agent-runtime = { path = "../philo-agent-runtime" }
philo-session = { path = "../philo-session" }
philo-tools = { path = "../philo-tools" }
ratatui = "0.30.2"
tokio = { version = "1.53.1", features = ["macros", "time"] }

[dev-dependencies]
insta = "1.48.0"
tokio = { version = "1.53.1", features = ["macros", "rt", "time"] }
